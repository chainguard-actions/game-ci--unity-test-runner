name: Test all test modes (editmode and playmode)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create Unity project structure
        run: |
          mkdir -p "$GITHUB_WORKSPACE/AllModesProject/ProjectSettings"
          echo "m_EditorVersion: 2021.3.0f1" > "$GITHUB_WORKSPACE/AllModesProject/ProjectSettings/ProjectVersion.txt"

      - id: action
        uses: .
        continue-on-error: true
        with:
          projectPath: AllModesProject
          testMode: all
          artifactsPath: all-mode-artifacts

      - name: Assert action ran with testMode=all
        env:
          OUTCOME: ${{ steps.action.outcome }}
          ARTIFACTS_PATH: ${{ steps.action.outputs.artifactsPath }}
        run: |
          echo "outcome: $OUTCOME"
          echo "artifactsPath: $ARTIFACTS_PATH"
          if [ "$OUTCOME" = "success" ]; then
            if [ -z "$ARTIFACTS_PATH" ]; then
              echo "FAIL: action succeeded but artifactsPath output is empty"
              exit 1
            fi
            echo "PASS: action succeeded with testMode=all, artifactsPath='$ARTIFACTS_PATH'"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (Unity not available in test environment)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
