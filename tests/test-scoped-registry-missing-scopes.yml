name: Test scoped registry without registryScopes fails
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # When packageMode=true and scopedRegistryUrl is set but registryScopes
      # is not provided, the action must fail with a clear error.
      # This validation happens in testCliArgs() before the CLI subprocess starts.
      - id: action
        uses: .
        continue-on-error: true
        with:
          packageMode: 'true'
          unityVersion: '2022.3.0f1'
          scopedRegistryUrl: 'https://registry.example.com'
          # registryScopes intentionally omitted
          testMode: 'editmode'
          coverageEnabled: 'false'

      - name: Assert action failed due to missing registryScopes
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail when scopedRegistryUrl is set without registryScopes, but got outcome='$OUTCOME'"
            exit 1
          fi
          echo "PASS: action correctly failed when scopedRegistryUrl set without registryScopes"
