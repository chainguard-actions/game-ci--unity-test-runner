name: Test custom docker image input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        with:
          unityVersion: '2022.3.0f1'
          customImage: 'unityci/editor:ubuntu-2022.3.0f1-base-3'
          testMode: 'all'
          artifactsPath: 'artifacts'

      - name: Assert action ran and failed gracefully with custom image
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded (unexpected but acceptable)"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully as expected (no Unity license)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
