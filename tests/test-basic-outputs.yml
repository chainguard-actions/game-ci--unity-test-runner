name: Test basic outputs always set
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # The action downloads the game-ci CLI and tries to run Unity tests.
      # In the test environment there is no Unity project or license, so the
      # action will fail — but the outputs (artifactsPath, coveragePath) are
      # set in a finally block and must always be populated regardless.
      - id: action
        uses: .
        continue-on-error: true
        with:
          unityVersion: '2022.3.0f1'
          testMode: 'editmode'
          artifactsPath: 'artifacts'
          coverageEnabled: 'false'

      - name: Assert artifactsPath output is set
        env:
          ARTIFACTS_PATH: ${{ steps.action.outputs.artifactsPath }}
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          echo "artifactsPath: $ARTIFACTS_PATH"
          if [ "$OUTCOME" = "success" ]; then
            if [ -z "$ARTIFACTS_PATH" ]; then
              echo "FAIL: action succeeded but artifactsPath output is empty"
              exit 1
            fi
            echo "PASS: artifactsPath='$ARTIFACTS_PATH'"
          elif [ "$OUTCOME" = "failure" ]; then
            if [ -z "$ARTIFACTS_PATH" ]; then
              echo "FAIL: action failed but artifactsPath output was not set (should be set in finally block)"
              exit 1
            fi
            echo "PASS: action failed gracefully (no Unity license/project) but artifactsPath='$ARTIFACTS_PATH' was set"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi

      - name: Assert coveragePath output is set
        env:
          COVERAGE_PATH: ${{ steps.action.outputs.coveragePath }}
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          echo "coveragePath: $COVERAGE_PATH"
          if [ "$OUTCOME" = "success" ]; then
            if [ -z "$COVERAGE_PATH" ]; then
              echo "FAIL: action succeeded but coveragePath output is empty"
              exit 1
            fi
            echo "PASS: coveragePath='$COVERAGE_PATH'"
          elif [ "$OUTCOME" = "failure" ]; then
            if [ -z "$COVERAGE_PATH" ]; then
              echo "FAIL: action failed but coveragePath output was not set (should be set in finally block)"
              exit 1
            fi
            echo "PASS: action failed gracefully but coveragePath='$COVERAGE_PATH' was set"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi

      - name: Assert artifactsPath output matches input
        env:
          ARTIFACTS_PATH: ${{ steps.action.outputs.artifactsPath }}
        run: |
          echo "artifactsPath: $ARTIFACTS_PATH"
          if [ "$ARTIFACTS_PATH" != "artifacts" ]; then
            echo "FAIL: expected artifactsPath='artifacts', got '$ARTIFACTS_PATH'"
            exit 1
          fi
          echo "PASS: artifactsPath matches input value"
