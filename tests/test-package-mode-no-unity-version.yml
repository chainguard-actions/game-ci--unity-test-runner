name: Test package mode requires explicit unityVersion
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # When packageMode=true and unityVersion='auto', the action must fail
      # with a clear error message before attempting to run any tests.
      # The error is thrown in testCliArgs() before the CLI subprocess starts.
      - id: action
        uses: .
        continue-on-error: true
        with:
          packageMode: 'true'
          unityVersion: 'auto'
          testMode: 'editmode'

      - name: Assert action failed due to missing unityVersion in package mode
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail when packageMode=true and unityVersion=auto, but got outcome='$OUTCOME'"
            exit 1
          fi
          echo "PASS: action correctly failed when packageMode=true and unityVersion=auto"
