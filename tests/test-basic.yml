name: Test basic usage with projectPath
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          projectPath: '.'
          unityVersion: '2022.3.0f1'
          testMode: 'editmode'
          artifactsPath: 'artifacts'
        continue-on-error: true
      - name: Assert artifactsPath output is set
        env:
          ARTIFACTS: ${{ steps.action.outputs.artifactsPath }}
        run: |
          echo "artifactsPath: $ARTIFACTS"
          if [ -z "$ARTIFACTS" ]; then
            echo "FAIL: artifactsPath output was empty"
            exit 1
          fi
          echo "PASS"
