name: Test projectPath input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          projectPath: MyProject
          unityVersion: '2022.3.0f1'
          testMode: editmode
      - name: Assert action ran (outputs set or failed gracefully without Unity license)
        env:
          OUTCOME: ${{ steps.action.outcome }}
          ARTIFACTS: ${{ steps.action.outputs.artifactsPath }}
        run: |
          echo "outcome: $OUTCOME"
          echo "artifactsPath: $ARTIFACTS"
          if [ "$OUTCOME" = "success" ]; then
            if [ -z "$ARTIFACTS" ]; then
              echo "FAIL: action succeeded but artifactsPath output is empty"
              exit 1
            fi
            echo "PASS: got artifactsPath '$ARTIFACTS'"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (no Unity license/project available in harness)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
