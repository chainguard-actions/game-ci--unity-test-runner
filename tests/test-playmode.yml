name: Test playmode testing with coverage options
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create Unity project structure for playmode tests
        run: |
          mkdir -p "$GITHUB_WORKSPACE/PlaymodeProject/ProjectSettings"
          echo "m_EditorVersion: 2021.3.15f1" > "$GITHUB_WORKSPACE/PlaymodeProject/ProjectSettings/ProjectVersion.txt"

      - id: action
        uses: .
        continue-on-error: true
        with:
          unityVersion: '2021.3.15f1'
          projectPath: PlaymodeProject
          testMode: playmode
          artifactsPath: playmode-artifacts
          coverageOptions: 'generateAdditionalMetrics;generateHtmlReport;generateBadgeReport;dontClear'
          customParameters: '-nographics'

      - name: Assert action ran for playmode or failed gracefully
        env:
          OUTCOME: ${{ steps.action.outcome }}
          ARTIFACTS: ${{ steps.action.outputs.artifactsPath }}
          COVERAGE: ${{ steps.action.outputs.coveragePath }}
        run: |
          echo "outcome: $OUTCOME"
          echo "artifactsPath output: $ARTIFACTS"
          echo "coveragePath output: $COVERAGE"
          if [ "$OUTCOME" = "success" ]; then
            if [ -z "$ARTIFACTS" ]; then
              echo "FAIL: action succeeded but artifactsPath output is empty"
              exit 1
            fi
            echo "PASS: action succeeded with artifactsPath='$ARTIFACTS'"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (Unity license/Docker not available in test environment)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
