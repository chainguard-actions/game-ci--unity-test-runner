name: Test auto unity version detection
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        with:
          unityVersion: 'auto'
          testMode: 'editmode'
          artifactsPath: 'artifacts'

      - name: Assert action ran with auto version or failed gracefully
        env:
          OUTCOME: ${{ steps.action.outcome }}
          ARTIFACTS: ${{ steps.action.outputs.artifactsPath }}
        run: |
          echo "outcome: $OUTCOME"
          echo "artifactsPath output: $ARTIFACTS"
          if [ "$OUTCOME" = "success" ]; then
            if [ -z "$ARTIFACTS" ]; then
              echo "FAIL: action succeeded but artifactsPath output is empty"
              exit 1
            fi
            echo "PASS: action succeeded with auto version detection, artifactsPath='$ARTIFACTS'"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (no ProjectVersion.txt or Unity license in harness)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
