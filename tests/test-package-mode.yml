name: Test package mode
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create minimal Unity package structure
        run: |
          mkdir -p "$GITHUB_WORKSPACE/MyUnityPackage"
          cat > "$GITHUB_WORKSPACE/MyUnityPackage/package.json" <<'EOF'
          {
            "name": "com.example.mypackage",
            "version": "1.0.0",
            "displayName": "My Package",
            "description": "A test package",
            "unity": "2021.3"
          }
          EOF

      - id: action
        uses: .
        continue-on-error: true
        with:
          unityVersion: 2021.3.0f1
          projectPath: MyUnityPackage
          packageMode: true
          testMode: editmode
          artifactsPath: package-artifacts

      - name: Assert action ran in package mode
        env:
          OUTCOME: ${{ steps.action.outcome }}
          ARTIFACTS_PATH: ${{ steps.action.outputs.artifactsPath }}
        run: |
          echo "outcome: $OUTCOME"
          echo "artifactsPath: $ARTIFACTS_PATH"
          if [ "$OUTCOME" = "success" ]; then
            if [ -z "$ARTIFACTS_PATH" ]; then
              echo "FAIL: action succeeded but artifactsPath output is empty"
              exit 1
            fi
            echo "PASS: package mode succeeded with artifactsPath='$ARTIFACTS_PATH'"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (Unity not available in test environment, package mode attempted)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
