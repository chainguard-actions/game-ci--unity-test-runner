name: Test package mode
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        with:
          unityVersion: '2022.3.0f1'
          testMode: 'editmode'
          packageMode: 'true'
          artifactsPath: 'artifacts'
          coverageOptions: 'generateAdditionalMetrics;generateHtmlReport;generateBadgeReport;dontClear;assemblyFilters:+MyPackage'

      - name: Assert action ran and failed gracefully in package mode
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded (unexpected but acceptable)"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully as expected (no Unity package/license)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
