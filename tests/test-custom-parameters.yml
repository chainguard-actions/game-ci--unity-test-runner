name: Test customParameters input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_REF: refs/heads/main
      GITHUB_EVENT_NAME: push
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          customParameters: '-nographics -batchmode'
          unityVersion: '2022.3.0f1'
          testMode: editmode
        continue-on-error: true
      - name: Assert action was invoked with customParameters
        run: |
          echo "Action completed (may fail without Unity license/Docker image)"
          echo "outcome: ${{ steps.action.outcome }}"
          # The action is expected to fail in CI without a real Unity license,
          # but we verify it was invoked (not skipped) and the input was accepted.
          if [ "${{ steps.action.outcome }}" = "skipped" ]; then
            echo "FAIL: action was skipped, expected it to be invoked"
            exit 1
          fi
          echo "PASS: action was invoked with customParameters input"
