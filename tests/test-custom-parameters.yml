name: Test customParameters input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          unityVersion: '2022.3.0f1'
          customParameters: '-nographics -batchmode'
          testMode: 'editmode'
          artifactsPath: 'artifacts'
      - name: Assert action ran with customParameters (success or graceful failure)
        env:
          OUTCOME: ${{ steps.action.outcome }}
          ARTIFACTS: ${{ steps.action.outputs.artifactsPath }}
        run: |
          echo "outcome: $OUTCOME"
          echo "artifactsPath: $ARTIFACTS"
          if [ "$OUTCOME" = "success" ]; then
            if [ -z "$ARTIFACTS" ]; then
              echo "FAIL: action succeeded but artifactsPath output is empty"
              exit 1
            fi
            echo "PASS: action succeeded with customParameters, artifactsPath=$ARTIFACTS"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (Unity not available in harness environment)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
