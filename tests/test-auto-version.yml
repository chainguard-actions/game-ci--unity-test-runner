name: Test auto unity version detection
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create minimal Unity project structure for version detection
        run: |
          mkdir -p tests/fixtures/unity-project/ProjectSettings
          echo 'm_EditorVersion: 2022.3.0f1' > tests/fixtures/unity-project/ProjectSettings/ProjectVersion.txt

      - id: action
        uses: .
        continue-on-error: true
        with:
          unityVersion: 'auto'
          projectPath: 'tests/fixtures/unity-project'
          testMode: 'editmode'
          artifactsPath: 'artifacts'

      - name: Assert action ran and failed gracefully (auto version detection attempted)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded (unexpected but acceptable)"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully as expected (no Unity license/Docker image)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
