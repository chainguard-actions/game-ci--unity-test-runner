name: Test auto unity version detection
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create Unity project with ProjectVersion.txt for auto-detection
        run: |
          mkdir -p "$GITHUB_WORKSPACE/MyUnityProject/ProjectSettings"
          echo "m_EditorVersion: 2022.3.5f1" > "$GITHUB_WORKSPACE/MyUnityProject/ProjectSettings/ProjectVersion.txt"

      - id: action
        uses: .
        continue-on-error: true
        with:
          unityVersion: 'auto'
          projectPath: MyUnityProject
          testMode: all
          artifactsPath: test-artifacts

      - name: Assert action ran with auto version detection or failed gracefully
        env:
          OUTCOME: ${{ steps.action.outcome }}
          ARTIFACTS: ${{ steps.action.outputs.artifactsPath }}
        run: |
          echo "outcome: $OUTCOME"
          echo "artifactsPath output: $ARTIFACTS"
          if [ "$OUTCOME" = "success" ]; then
            if [ -z "$ARTIFACTS" ]; then
              echo "FAIL: action succeeded but artifactsPath output is empty"
              exit 1
            fi
            echo "PASS: action succeeded with artifactsPath='$ARTIFACTS'"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (Unity license/Docker not available in test environment)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
