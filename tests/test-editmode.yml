name: Test EditMode test scenario
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        with:
          unityVersion: '2022.3.0f1'
          testMode: 'editmode'
          artifactsPath: 'test-results/editmode'

      - name: Assert action ran (EditMode) or failed gracefully without Unity
        env:
          OUTCOME: ${{ steps.action.outcome }}
          ARTIFACTS_PATH: ${{ steps.action.outputs.artifactsPath }}
        run: |
          echo "outcome: $OUTCOME"
          echo "artifactsPath: $ARTIFACTS_PATH"
          if [ "$OUTCOME" = "success" ]; then
            if [ -z "$ARTIFACTS_PATH" ]; then
              echo "FAIL: action succeeded but artifactsPath output is empty"
              exit 1
            fi
            echo "PASS: action succeeded with artifactsPath='$ARTIFACTS_PATH'"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (Unity not available in test environment)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
