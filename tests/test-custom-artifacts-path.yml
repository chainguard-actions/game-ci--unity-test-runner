name: Test custom artifactsPath output
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # The action always sets the artifactsPath output (in a finally block)
      # to whatever was passed as the artifactsPath input. Verify a custom
      # path is reflected correctly in the output.
      - id: action
        uses: .
        continue-on-error: true
        with:
          unityVersion: '2022.3.0f1'
          testMode: 'editmode'
          artifactsPath: 'my-custom-test-results'
          coverageEnabled: 'false'

      - name: Assert artifactsPath output reflects custom input value
        env:
          ARTIFACTS_PATH: ${{ steps.action.outputs.artifactsPath }}
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          echo "artifactsPath: $ARTIFACTS_PATH"
          # The output must be set regardless of success/failure (finally block)
          if [ -z "$ARTIFACTS_PATH" ]; then
            echo "FAIL: artifactsPath output is empty — should always be set by the finally block"
            exit 1
          fi
          if [ "$ARTIFACTS_PATH" != "my-custom-test-results" ]; then
            echo "FAIL: expected artifactsPath='my-custom-test-results', got '$ARTIFACTS_PATH'"
            exit 1
          fi
          echo "PASS: artifactsPath='$ARTIFACTS_PATH' matches custom input"

      - name: Assert coveragePath output is always 'CodeCoverage'
        env:
          COVERAGE_PATH: ${{ steps.action.outputs.coveragePath }}
        run: |
          echo "coveragePath: $COVERAGE_PATH"
          if [ -z "$COVERAGE_PATH" ]; then
            echo "FAIL: coveragePath output is empty — should always be set by the finally block"
            exit 1
          fi
          if [ "$COVERAGE_PATH" != "CodeCoverage" ]; then
            echo "FAIL: expected coveragePath='CodeCoverage', got '$COVERAGE_PATH'"
            exit 1
          fi
          echo "PASS: coveragePath='$COVERAGE_PATH'"
