name: Test custom artifacts path
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        with:
          unityVersion: '2022.3.0f1'
          testMode: 'editmode'
          artifactsPath: 'my-custom-artifacts'

      - name: Assert artifactsPath output matches configured path or failed gracefully
        env:
          OUTCOME: ${{ steps.action.outcome }}
          ARTIFACTS: ${{ steps.action.outputs.artifactsPath }}
        run: |
          echo "outcome: $OUTCOME"
          echo "artifactsPath output: $ARTIFACTS"
          if [ "$OUTCOME" = "success" ]; then
            if [ -z "$ARTIFACTS" ]; then
              echo "FAIL: action succeeded but artifactsPath output is empty"
              exit 1
            fi
            if [ "$ARTIFACTS" != "my-custom-artifacts" ]; then
              echo "FAIL: expected artifactsPath='my-custom-artifacts' but got '$ARTIFACTS'"
              exit 1
            fi
            echo "PASS: artifactsPath output matches configured value"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (no Unity license/project available in harness)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
